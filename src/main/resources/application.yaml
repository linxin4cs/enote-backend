server:
  port: 8080

file:
  upload:
    base-dir:

spring:
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/enote?useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 123456

  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password: 123456
    mongodb:
      uri: mongodb://localhost:27017/enote

  mail:
    host:
    username:
    password:
    default-encoding: UTF-8
    properties:
      from:
      mail:
      # 开启debug模式，这样邮件发送过程的日志会在控制台打印出来，方便排查错误
      # debug: true

mybatis-plus:
  global-config:
    db-config:
      update-strategy: ignored

logging:
  level:
    org.springframework.security: ERROR
    org.apache.catalina.connector: ERROR
